<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>恐怖一家 · 老宅诅咒</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg: #050505;
        --panel: rgba(14, 12, 12, 0.94);
        --panel2: rgba(28, 23, 21, 0.92);
        --border: #5f4438;
        --border-light: #8d654f;
        --text: #eadfd5;
        --muted: #9c8d84;
        --accent: #d29162;
        --danger: #c94438;
        --danger2: #7d1f1a;
        --gold: #d6a85f;
        --green: #72a178;
        --blue: #829baa;
    }

    html,
    body {
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        overflow-x: hidden;
        color: var(--text);
        background:
            radial-gradient(circle at 50% 20%, #211815 0%, #0b0808 40%, #020202 100%);
        font-family:
            "Microsoft YaHei",
            "PingFang SC",
            "Segoe UI",
            sans-serif;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.14;
        z-index: 1000;
        background-image:
            repeating-linear-gradient(
                0deg,
                rgba(255,255,255,0.03) 0px,
                rgba(255,255,255,0.03) 1px,
                transparent 1px,
                transparent 3px
            );
        animation: noiseMove 0.18s steps(2) infinite;
    }

    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        box-shadow: inset 0 0 180px 35px rgba(0,0,0,0.95);
    }

    @keyframes noiseMove {
        0% { transform: translateY(0); }
        50% { transform: translateY(2px); }
        100% { transform: translateY(-2px); }
    }

    @keyframes pulseDanger {
        0%,100% {
            box-shadow: 0 0 0 rgba(190,45,35,0);
        }
        50% {
            box-shadow: 0 0 22px rgba(190,45,35,0.28);
        }
    }

    @keyframes glitch {
        0%, 100% { transform: translate(0); }
        25% { transform: translate(-1px, 0); }
        50% { transform: translate(1px, 1px); }
        75% { transform: translate(0, -1px); }
    }

    .app {
        position: relative;
        z-index: 2;
        width: min(1500px, calc(100% - 24px));
        margin: 12px auto;
        min-height: calc(100vh - 24px);
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(145,96,70,0.65);
        border-radius: 20px;
        overflow: hidden;
        background: rgba(4,4,4,0.83);
        box-shadow:
            0 30px 90px rgba(0,0,0,0.7),
            inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .header {
        padding: 16px 20px 13px;
        background:
            linear-gradient(180deg, rgba(40,27,22,0.95), rgba(15,12,11,0.96));
        border-bottom: 1px solid var(--border);
    }

    .title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 14px;
    }

    .game-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(22px, 3vw, 34px);
        letter-spacing: 4px;
        color: #f0d4bc;
        text-shadow:
            0 2px 0 #351a12,
            0 0 18px rgba(184,87,48,0.28);
    }

    .subtitle {
        margin-top: 5px;
        font-size: 12px;
        color: #967e72;
        letter-spacing: 2px;
    }

    .mini-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    button {
        font-family: inherit;
    }

    .mini-btn,
    .game-btn,
    .item-btn {
        cursor: pointer;
        color: #e9d8ca;
        border: 1px solid #684a3a;
        transition:
            transform 0.16s ease,
            border-color 0.16s ease,
            background 0.16s ease,
            box-shadow 0.16s ease;
    }

    .mini-btn {
        border-radius: 10px;
        padding: 8px 12px;
        background: #1c1715;
        font-size: 12px;
    }

    .mini-btn:hover,
    .game-btn:hover,
    .item-btn:hover {
        transform: translateY(-1px);
        border-color: #a8795c;
    }

    .status-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(130px, 1fr));
        gap: 9px;
    }

    .status-card {
        min-height: 64px;
        border-radius: 12px;
        padding: 9px 11px;
        background:
            linear-gradient(145deg, rgba(38,31,28,0.92), rgba(18,15,14,0.94));
        border: 1px solid rgba(102,75,61,0.62);
    }

    .status-label {
        font-size: 10px;
        color: #88776f;
        letter-spacing: 1.5px;
        margin-bottom: 5px;
    }

    .status-value {
        font-size: 14px;
        color: #f0d8c4;
        font-weight: bold;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .bar {
        height: 7px;
        margin-top: 7px;
        border-radius: 10px;
        overflow: hidden;
        background: #151210;
        border: 1px solid rgba(77,59,50,0.8);
    }

    .bar-fill {
        height: 100%;
        width: 100%;
        transition: width 0.25s ease;
        background: linear-gradient(90deg, #9c2e28, #de6b55);
    }

    .bar-fill.progress {
        background: linear-gradient(90deg, #6c5849, #c19366);
    }

    .layout {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1.65fr) minmax(330px, 0.75fr);
    }

    .left-panel {
        min-width: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background:
            radial-gradient(circle at 50% 20%, rgba(40,27,21,0.2), transparent 45%),
            rgba(3,3,3,0.92);
    }

    .scene-head {
        padding: 15px 18px;
        border-bottom: 1px solid #342921;
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: center;
    }

    .location-title {
        font-family: Georgia, serif;
        font-size: 22px;
        color: #e7c8ad;
    }

    .danger-badge {
        flex-shrink: 0;
        border-radius: 999px;
        font-size: 11px;
        padding: 5px 10px;
        border: 1px solid #744238;
        color: #d9947e;
        background: rgba(70,29,24,0.45);
    }

    .story {
        padding: 19px;
        overflow-y: auto;
        min-height: 380px;
        max-height: calc(100vh - 335px);
        scroll-behavior: smooth;
    }

    .story-line {
        max-width: 900px;
        margin: 0 0 12px;
        padding: 10px 13px;
        line-height: 1.72;
        font-size: 14px;
        color: #d8cbc0;
        border-left: 2px solid #4e3e36;
        background: linear-gradient(
            90deg,
            rgba(54,43,37,0.18),
            transparent
        );
        white-space: pre-wrap;
    }

    .story-line.event {
        color: #f0c99f;
        border-left-color: #b06a42;
        background: linear-gradient(
            90deg,
            rgba(118,55,30,0.2),
            transparent
        );
    }

    .story-line.danger {
        color: #e69a91;
        border-left-color: #bb4439;
        background: linear-gradient(
            90deg,
            rgba(139,39,32,0.22),
            transparent
        );
    }

    .story-line.good {
        color: #bad3b5;
        border-left-color: #6c956c;
        background: linear-gradient(
            90deg,
            rgba(69,107,66,0.17),
            transparent
        );
    }

    .story-line.system {
        color: #9f9187;
        font-size: 12px;
        border-left-color: #51483f;
    }

    .objective {
        padding: 13px 17px;
        border-top: 1px solid #342921;
        background: rgba(18,14,13,0.96);
    }

    .objective-title {
        color: #a78b78;
        font-size: 11px;
        letter-spacing: 1.5px;
        margin-bottom: 5px;
    }

    .objective-text {
        color: #efcfaf;
        line-height: 1.5;
        font-size: 13px;
    }

    .right-panel {
        min-width: 0;
        border-left: 1px solid #49372d;
        background:
            linear-gradient(180deg, rgba(20,16,15,0.96), rgba(10,9,9,0.98));
        overflow-y: auto;
        max-height: calc(100vh - 165px);
        padding: 14px;
    }

    .section {
        margin-bottom: 12px;
        border: 1px solid rgba(103,77,64,0.55);
        background: rgba(31,25,22,0.68);
        border-radius: 13px;
        padding: 12px;
    }

    .section-title {
        margin-bottom: 10px;
        font-size: 11px;
        letter-spacing: 1.7px;
        color: #b0907d;
        text-transform: uppercase;
    }

    .button-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .game-btn {
        min-height: 36px;
        border-radius: 9px;
        padding: 8px 11px;
        background: linear-gradient(180deg, #322720, #211a17);
        font-size: 12px;
    }

    .game-btn:hover {
        background: linear-gradient(180deg, #4b372b, #2b211c);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .game-btn:disabled {
        cursor: not-allowed;
        opacity: 0.32;
        transform: none;
        filter: grayscale(0.4);
    }

    .game-btn.danger {
        color: #ffd1c9;
        background: linear-gradient(180deg, #682b25, #421d1a);
        border-color: #91473e;
        animation: pulseDanger 1.8s infinite;
    }

    .game-btn.good {
        background: linear-gradient(180deg, #344333, #222d22);
        border-color: #526d50;
        color: #c9e1c4;
    }

    .item-list {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
    }

    .item-btn {
        border-radius: 999px;
        background: #251e1b;
        padding: 7px 10px;
        font-size: 12px;
        border-left: 3px solid #976c4f;
    }

    .item-btn.important {
        color: #f0c78f;
        border-left-color: #d39a4e;
        box-shadow: inset 0 0 10px rgba(202,140,73,0.08);
    }

    .empty-text {
        color: #70645e;
        font-size: 12px;
    }

    .quest-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
    }

    .quest-item {
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #473830;
        background: #171312;
        font-size: 11px;
        color: #958780;
    }

    .quest-item.done {
        color: #a8c3a2;
        border-color: #4f6c4d;
    }

    .quest-item.pending {
        color: #b8a18f;
    }

    .ending-overlay {
        position: fixed;
        z-index: 5000;
        inset: 0;
        background: rgba(0,0,0,0.88);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        backdrop-filter: blur(8px);
    }

    .ending-overlay.show {
        display: flex;
    }

    .ending-card {
        width: min(620px, 100%);
        text-align: center;
        padding: 34px 26px;
        border: 1px solid #765348;
        border-radius: 18px;
        background:
            radial-gradient(circle at top, #2f211d, #0b0909 65%);
        box-shadow: 0 30px 90px #000;
    }

    .ending-title {
        font-family: Georgia, serif;
        font-size: clamp(28px, 6vw, 46px);
        margin-bottom: 18px;
        color: #f0c6a5;
    }

    .ending-text {
        max-width: 520px;
        margin: auto;
        line-height: 1.9;
        color: #cdbdb2;
        font-size: 14px;
    }

    .ending-actions {
        margin-top: 26px;
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    .low-sanity .app {
        animation: glitch 0.22s steps(2) infinite;
    }

    .critical-sanity::after {
        content: "";
        position: fixed;
        z-index: 998;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle, transparent 35%, rgba(88,0,0,0.28) 100%);
    }

    ::-webkit-scrollbar {
        width: 7px;
    }

    ::-webkit-scrollbar-track {
        background: #0f0d0c;
    }

    ::-webkit-scrollbar-thumb {
        border-radius: 10px;
        background: #5a4236;
    }

    @media (max-width: 1050px) {
        .status-grid {
            grid-template-columns: repeat(3, 1fr);
        }

        .layout {
            grid-template-columns: 1fr;
        }

        .right-panel {
            border-left: none;
            border-top: 1px solid #49372d;
            max-height: none;
        }

        .story {
            max-height: 52vh;
        }
    }

    @media (max-width: 650px) {
        .app {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            border-radius: 0;
            border-left: 0;
            border-right: 0;
        }

        .header {
            padding: 13px 11px 11px;
        }

        .title-row {
            align-items: flex-start;
        }

        .game-title {
            font-size: 21px;
        }

        .subtitle {
            display: none;
        }

        .status-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .status-card {
            min-height: 59px;
        }

        .story {
            min-height: 330px;
            max-height: 50vh;
            padding: 12px;
        }

        .right-panel {
            padding: 10px;
        }

        .scene-head {
            padding: 12px;
        }

        .objective {
            padding: 11px 12px;
        }

        .game-btn {
            flex-grow: 1;
        }
    }
</style>
</head>

<body>

<div class="app" id="app">

    <header class="header">
        <div class="title-row">
            <div>
                <div class="game-title">恐怖一家</div>
                <div class="subtitle">THE CURSED FAMILY · 1927</div>
            </div>

            <div class="mini-actions">
                <button class="mini-btn" onclick="showInventory()">🎒 背包</button>
                <button class="mini-btn" onclick="showHelp()">❔ 提示</button>
                <button class="mini-btn" onclick="restartGame()">↻ 重开</button>
            </div>
        </div>

        <div class="status-grid">

            <div class="status-card">
                <div class="status-label">当前位置</div>
                <div class="status-value" id="locName">门厅</div>
            </div>

            <div class="status-card">
                <div class="status-label">时间</div>
                <div class="status-value" id="timeText">第1天 09:00</div>
            </div>

            <div class="status-card">
                <div class="status-label">姿态</div>
                <div class="status-value" id="postureText">站立</div>
            </div>

            <div class="status-card">
                <div class="status-label">理智</div>
                <div class="status-value"><span id="sanityText">100</span>%</div>
                <div class="bar">
                    <div class="bar-fill" id="sanityBar"></div>
                </div>
            </div>

            <div class="status-card">
                <div class="status-label">调查进度</div>
                <div class="status-value"><span id="progressText">0</span>%</div>
                <div class="bar">
                    <div class="bar-fill progress" id="progressBar"></div>
                </div>
            </div>

            <div class="status-card">
                <div class="status-label">宅邸状态</div>
                <div class="status-value" id="dangerText">异常</div>
            </div>

        </div>
    </header>

    <main class="layout">

        <section class="left-panel">

            <div class="scene-head">
                <div>
                    <div class="location-title" id="sceneTitle">门厅</div>
                </div>

                <div class="danger-badge" id="phaseBadge">
                    ☀️ 白昼
                </div>
            </div>

            <div class="story" id="story"></div>

            <div class="objective">
                <div class="objective-title">当前目标</div>
                <div class="objective-text" id="objectiveText">
                    调查门厅，寻找进入这栋宅邸深处的线索。
                </div>
            </div>

        </section>

        <aside class="right-panel" id="actionPanel"></aside>

    </main>
</div>

<div class="ending-overlay" id="endingOverlay">
    <div class="ending-card">
        <div class="ending-title" id="endingTitle"></div>
        <div class="ending-text" id="endingText"></div>

        <div class="ending-actions">
            <button class="game-btn good" onclick="restartGame()">
                ↻ 再次进入老宅
            </button>
        </div>
    </div>
</div>

<script>
/* =========================================================
   恐怖一家 · 重写版
   单文件文字探索恐怖游戏
========================================================= */


/* =========================================================
   游戏状态
========================================================= */

const defaultGame = () => ({
    currentLocation: "entrance_hall",
    currentPos: "中央",

    sanity: 100,

    time: {
        day: 1,
        hour: 9,
        minute: 0
    },

    posture: "stand",

    collected: {
        old_key: false,
        kitchen_knife: false,
        locket: false,
        rattle: false
    },

    clues: {
        family_photo: false,
        diary_read: false,
        symbol_chart: false,
        desk_document: false,
        cabinet_photo: false
    },

    puzzles: {
        diary: false,
        toybox: false,
        desk: false
    },

    family: {
        father: false,
        mother: false,
        child: false
    },

    familyTalkCount: {
        father: 0,
        mother: 0,
        child: 0
    },

    inspectedParts: {},

    visited: {
        entrance_hall: true
    },

    actionCount: 0,
    actionsSinceEncounter: 0,

    ritualPerformed: false,

    gameOver: false,

    endingsSeen: [],

    flags: {
        mirrorScare: false,
        fridgeScare: false,
        firstNightWarning: false
    }
});

let game = defaultGame();


/* =========================================================
   地图数据
========================================================= */

const locationNames = {
    entrance_hall: "门厅",
    living_room: "客厅",
    kitchen: "厨房",
    upstairs_hall: "二楼走廊",
    master_bedroom: "主卧室",
    children_room: "儿童房",
    bathroom: "浴室",
    study: "书房"
};


const descriptions = {
    entrance_hall:
        "门厅很冷。\n\n褪色的全家福挂在墙上，照片里的人似乎都没有看镜头。前门已经从里面彻底锁死。\n\n东边通向客厅，西边是厨房，北面的楼梯延伸到黑暗的二楼。",

    living_room:
        "白布盖着陈旧家具，壁炉里只有发黑的冷灰。\n\n角落的电视机没有接电，却偶尔会闪过一道雪花。\n\n东边有一扇通往书房的门。",

    kitchen:
        "空气里混着铁锈与腐败食物的气味。\n\n水槽堆着发黑的餐具。冰箱门虚掩着，操作台上静静放着一把菜刀。",

    upstairs_hall:
        "二楼比楼下更加安静。\n\n剥落的墙纸后露出深色木板，走廊两侧分布着主卧、儿童房与浴室。",

    master_bedroom:
        "一张双人床占据房间中央。\n\n梳妆台镜面布满灰尘，床头柜上放着一本被锁住的旧日记。",

    children_room:
        "散落的玩具铺满地面。\n\n墙边有一只上锁的玩具箱，小床的被子里似乎有什么东西刚刚动过。",

    bathroom:
        "浴室湿冷得不正常。\n\n镜子始终蒙着一层白雾，浴缸里的黑水完全看不见底。药柜半开着。",

    study:
        "书架塞满神秘学书籍。\n\n墙上钉着一张奇怪符号图，书桌抽屉带着数字锁。桌面上刻着：1927。"
};


const connections = {
    entrance_hall: {
        "东 → 客厅": "living_room",
        "西 → 厨房": "kitchen",
        "北 ↑ 二楼": "upstairs_hall"
    },

    living_room: {
        "西 ← 门厅": "entrance_hall",
        "东 → 书房": "study"
    },

    kitchen: {
        "东 → 门厅": "entrance_hall"
    },

    upstairs_hall: {
        "南 ↓ 门厅": "entrance_hall",
        "东 → 主卧": "master_bedroom",
        "西 ← 儿童房": "children_room",
        "北 ↑ 浴室": "bathroom"
    },

    master_bedroom: {
        "西 ← 走廊": "upstairs_hall"
    },

    children_room: {
        "东 → 走廊": "upstairs_hall"
    },

    bathroom: {
        "南 ↓ 走廊": "upstairs_hall"
    },

    study: {
        "西 ← 客厅": "living_room"
    }
};


const locationsItems = {
    entrance_hall: [
        "全家福",
        "小桌子"
    ],

    living_room: [
        "电视机",
        "壁炉",
        "沙发"
    ],

    kitchen: [
        "水槽",
        "冰箱",
        "菜刀",
        "操作台"
    ],

    upstairs_hall: [
        "墙纸",
        "小柜子"
    ],

    master_bedroom: [
        "床",
        "梳妆台",
        "日记",
        "床头柜",
        "椅子"
    ],

    children_room: [

/* =========================================================
   基础工具
========================================================= */

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}


function randomOf(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}


function addStory(text, type = "") {
    const story = document.getElementById("story");

    const div = document.createElement("div");
    div.className = "story-line" + (type ? " " + type : "");
    div.textContent = text;

    story.appendChild(div);

    requestAnimationFrame(() => {
        story.scrollTop = story.scrollHeight;
    });
}


function getTimeString() {
    const h = String(game.time.hour).padStart(2, "0");
    const m = String(game.time.minute).padStart(2, "0");

    return `第${game.time.day}天 ${h}:${m}`;
}


function getPhase() {
    const hour = game.time.hour;

    if (hour >= 6 && hour < 10) {
        return {
            id: "morning",
            text: "🌅 清晨"
        };
    }

    if (hour >= 10 && hour < 17) {
        return {
            id: "day",
            text: "☀️ 白昼"
        };
    }

    if (hour >= 17 && hour < 21) {
        return {
            id: "evening",
            text: "🌆 黄昏"
        };
    }

    return {
        id: "night",
        text: "🌑 深夜"
    };
}


function isNight() {
    const h = game.time.hour;
    return h >= 21 || h < 6;
}


function changeSanity(amount, message = "") {
    if (game.gameOver) return;

    game.sanity = clamp(game.sanity + amount, 0, 100);

    if (message) {
        addStory(
            `${message} 理智${amount > 0 ? "+" : ""}${amount}`,
            amount < 0 ? "danger" : "good"
        );
    }

    if (game.sanity <= 0) {
        triggerEnding("madness");
    }

    updateUI();
}


function advanceTime(minutes, canEncounter = true) {
    if (game.gameOver) return;

    game.time.minute += minutes;

    while (game.time.minute >= 60) {
        game.time.minute -= 60;
        game.time.hour++;

        if (game.time.hour >= 24) {
            game.time.hour = 0;
            game.time.day++;
        }
    }

    game.actionCount++;
    game.actionsSinceEncounter++;

    if (isNight() && !game.flags.firstNightWarning) {
        game.flags.firstNightWarning = true;

        addStory(
            "夜色完全覆盖了老宅。楼上传来脚步声，而你确定自己刚才没有在那里留下任何人。",
            "danger"
        );
    }

    if (canEncounter) {
        tryEncounter();
    }

    updateUI();
}


/* =========================================================
   进度
========================================================= */

function getProgress() {
    let done = 0;
    const total = 13;

    if (game.collected.kitchen_knife) done++;
    if (game.collected.locket) done++;
    if (game.collected.rattle) done++;

    if (game.puzzles.diary) done++;
    if (game.puzzles.toybox) done++;
    if (game.puzzles.desk) done++;

    if (game.family.father) done++;
    if (game.family.mother) done++;
    if (game.family.child) done++;

    if (game.clues.family_photo) done++;
    if (game.clues.diary_read) done++;
    if (game.clues.symbol_chart) done++;
    if (game.clues.desk_document) done++;

    return Math.round(done / total * 100);
}


function getObjective() {
    if (!game.collected.old_key) {
        return "搜索门厅。某个不起眼的家具里，也许藏着能够打开其他东西的钥匙。";
    }

    if (!game.puzzles.diary) {
        return "你已经拿到旧钥匙。主卧里那本锁住的日记值得调查。";
    }

    if (!game.clues.diary_read) {
        return "日记已经打开。阅读它，弄清这栋宅邸发生过什么。";
    }

    if (!game.collected.locket) {
        return "日记提到了『爱坠』。仔细搜查主卧里的旧家具。";
    }

    if (!game.clues.symbol_chart) {
        return "你需要理解吊坠上的符文。书房里似乎有与仪式有关的资料。";
    }

    if (!game.puzzles.toybox) {
        return "符号图与吊坠可以共同解开儿童房里的玩具箱。";
    }

    if (!game.puzzles.desk) {
        return "摇铃与日记提供了重要线索。回到书房研究刻着 1927 的书桌。";
    }

    if (!game.collected.kitchen_knife) {
        return "仪式仍缺少象征『血』的祭刃。厨房里应该能找到合适的东西。";
    }

    if (!(game.family.father && game.family.mother && game.family.child)) {
        return "你还没有见过所有家庭成员。继续探索宅邸，他们似乎正在主动寻找你。";
    }

    if (game.sanity < 45) {
        return "仪式条件几乎满足，但你的精神状态很危险。先找地方休息，提高理智。";
    }

    return "你已经了解真相并收集三件圣物。前往客厅壁炉，决定是否举行最终仪式。";
}

function updateUI() {
    const location = locationNames[game.currentLocation];

    document.getElementById("locName").textContent = location;
    document.getElementById("sceneTitle").textContent = location;
    document.getElementById("timeText").textContent = getTimeString();

    document.getElementById("sanityText").textContent = game.sanity;
    document.getElementById("sanityBar").style.width = game.sanity + "%";

    let postureText = "站立";

    if (game.posture === "sit") postureText = "坐着";
    if (game.posture === "lie") postureText = "躺着";
    if (game.posture === "sleep") postureText = "睡眠";

    document.getElementById("postureText").textContent = postureText;

    const progress = getProgress();

    document.getElementById("progressText").textContent = progress;
    document.getElementById("progressBar").style.width = progress + "%";

    const phase = getPhase();

    document.getElementById("phaseBadge").textContent = phase.text;

    let dangerText = "低危";

    if (game.sanity < 70 || isNight()) {
        dangerText = "不安";
    }

    if (game.sanity < 40) {
        dangerText = "危险";
    }

    if (game.sanity < 20) {
        dangerText = "极度危险";
    }

    document.getElementById("dangerText").textContent = dangerText;

    document.getElementById("objectiveText").textContent = getObjective();

    document.body.classList.toggle(
        "low-sanity",
        game.sanity <= 20 && !game.gameOver
    );

    document.body.classList.toggle(
        "critical-sanity",
        game.sanity <= 35 && !game.gameOver
    );

    renderActions();
}

========================================================= */

function move(target) {
    if (game.posture !== "stand") {
        addStory(
            "你需要先站起来。",
            "system"
        );

        return;
    }

    if (!locationNames[target]) return;

    game.currentLocation = target;
    game.currentPos = "中央";
    game.visited[target] = true;

    advanceTime(5);

    addStory(
        `你进入了【${locationNames[target]}】。`,
        "event"
    );

    addStory(
        descriptions[target]
    );

    updateUI();
}


function moveToPosition(pos) {
    if (game.posture !== "stand") {
        addStory(
            "你需要先站起来。",
            "system"
        );

        return;
    }

    game.currentPos = pos;

    advanceTime(2);

    addStory(
        `你走到【${pos}】附近。`,
        "system"
    );

    if (
        pos === "冰箱" &&
        !game.flags.fridgeScare
    ) {
        game.flags.fridgeScare = true;

        addStory(
            "冰箱门突然自己打开了一条缝。一股令人作呕的腐臭味涌出来。",
            "danger"
        );

        changeSanity(-4);
    }

    if (
        pos === "镜子" &&
        !game.flags.mirrorScare
    ) {
        game.flags.mirrorScare = true;

        addStory(
            "雾气后的镜子里，你身后站着一个女人。\n\n你猛地回头——身后什么都没有。",
            "danger"
        );

        changeSanity(-7);
    }

    updateUI();
}

            );

            addStory(
                "符号图上描绘着三种象征：\n\n♡ 爱 —— 吊坠\n◌ 音 —— 摇铃\n▲ 血 —— 祭刃\n\n三者需要在『旧火之地』共同使用。",

                "没有发现特别之处。"

    updateUI();
}

/* =========================================================
   家人遭遇
========================================================= */

function tryEncounter() {
    if (game.gameOver) return;

    const unmet = [];

    if (!game.family.father) {
        unmet.push("father");
    }

    if (!game.family.mother) {
        unmet.push("mother");
    }

    if (!game.family.child) {
        unmet.push("child");
    }

    if (!unmet.length) return;

    /*
        防止原版随机卡关：

        普通情况下有一定概率遇到家人。
        连续 6 次有效行动未遇到时强制触发。
    */

    let chance = 0.13;

    if (isNight()) {
        chance = 0.22;
    }

    if (game.sanity < 45) {
        chance += 0.06;
    }

    const forced =
        game.actionsSinceEncounter >= 6;

    if (
        !forced &&
        Math.random() > chance
    ) {
        return;
    }

    let target = randomOf(unmet);

    /*
        让遭遇稍微与地点有关，
        但不会因此彻底卡关。
    */

    if (
        game.currentLocation === "master_bedroom" &&
        unmet.includes("mother") &&
        Math.random() < 0.6
    ) {
        target = "mother";
    }

    if (
        game.currentLocation === "children_room" &&
        unmet.includes("child") &&
        Math.random() < 0.75
    ) {
        target = "child";
    }

    if (
        game.currentLocation === "study" &&
        unmet.includes("father") &&
        Math.random() < 0.55
    ) {
        target = "father";
    }

    game.actionsSinceEncounter = 0;

    game.family[target] = true;

    const names = {
        father: "父亲",
        mother: "母亲",
        child: "孩子"
    };

    addStory(
        `⚠ 身后的空气突然变得冰冷。\n\n【${names[target]}】出现了。`,
        "danger"
    );

    const firstLine = familyTalks[target][0];

    addStory(
        `「${firstLine}」`,
        "event"
    );

    changeSanity(
        -8,
        "你意识到眼前的人根本不是活人。"
    );
}


/* =========================================================
   对话
========================================================= */

function talk(person) {
    if (!game.family[person]) {
        addStory(
            "你没有看到这个人。",
            "system"
        );

        return;
    }

    advanceTime(
        4,
        false
    );

    const names = {
        father: "父亲",
        mother: "母亲",
        child: "孩子"
    };

    let count = game.familyTalkCount[person];

    const lines = familyTalks[person];

    /*
        第一次遭遇时已经播放第一句，
        所以后续交谈优先播放后面的内容。
    */

    let index = Math.min(
        count + 1,
        lines.length - 1
    );

    addStory(
        `${names[person]}：\n「${lines[index]}」`,
        "event"
    );

    game.familyTalkCount[person]++;

    if (
        index === lines.length - 1 &&
        Math.random() < 0.35
    ) {
        changeSanity(
            -2,
            "他们的身影在你眼前短暂扭曲。"
        );
    }

    updateUI();
}


/* =========================================================
   休息系统
========================================================= */

function roomHasSeat() {
    const items = locationsItems[game.currentLocation];

    return items.some(item =>
        [
            "沙发",
            "椅子",
            "小床",
            "床"
        ].includes(item)
    );
}


function roomHasBed() {
    const items = locationsItems[game.currentLocation];

    return items.some(item =>
        [
            "床",
            "小床"
        ].includes(item)
    );
}


function sit() {
    if (!roomHasSeat()) {
        addStory(
            "这里没有适合坐下的地方。",
            "system"
        );

        return;
    }

    if (game.posture === "sit") {
        addStory(
            "你已经坐着。",
            "system"
        );

        return;
    }

    game.posture = "sit";

    addStory(
        "你坐下来，让呼吸慢慢平稳。",

    );

    advanceTime(10);

    changeSanity(
        isNight() ? 2 : 4,
        "短暂休息让你稍微冷静了一些。"
    );
}


function lie() {
    if (!roomHasBed()) {
        addStory(
            "这里没有可以躺下的床。",
            "system"
        );

        return;
    }

    game.posture = "lie";

    addStory(
        "你躺在床上，但这里的温度低得让人难以真正放松。",

    );

    advanceTime(10);

    changeSanity(
        isNight() ? 3 : 5,
        "你闭眼休息了一会儿。"

}


function stand() {
    if (game.posture === "stand") {
        addStory(
            "你已经站着。",
            "system"
        );

        return;
    }

    game.posture = "stand";

    advanceTime(
        1,
        false
    );

    addStory(
        "你重新站了起来。",

    );

    updateUI();
}


function sleep() {
    if (
        game.currentLocation !== "master_bedroom"
    ) {
        addStory(
            "只有主卧的床看起来勉强能让你真正睡一会儿。",
            "system"
        );

        return;
    }

    if (game.posture !== "lie") {
        addStory(
            "你需要先躺下。",
            "system"
        );

        return;
    }

    if (!isNight()) {
        addStory(
            "现在还不是适合睡觉的时候。",
            "system"
        );

        return;
    }

    game.posture = "sleep";

    addStory(
        "你最终还是抵挡不住疲惫，沉沉睡去……",
        "event"
    );

    let minutesToEight;

    if (game.time.hour >= 21) {
        minutesToEight =
            (24 - game.time.hour) * 60
            - game.time.minute
            + 8 * 60;
    } else {
        minutesToEight =
            (8 - game.time.hour) * 60
            - game.time.minute;
    }

    advanceTime(
        minutesToEight,
        false
    );

    game.posture = "lie";

    changeSanity(
        30,
        "睡眠恢复了你的精神。"
    );

    addStory(
        `你醒来了。\n现在是 ${getTimeString()}。`,
        "good"
    );

    updateUI();
}

/* =========================================================
   最终仪式
========================================================= */

function performRitual() {
    if (game.ritualPerformed) return;

    if (
        game.currentLocation !== "living_room"
    ) {
        addStory(
            "仪式只能在客厅壁炉进行。",
            "system"
        );

        return;
    }

    /*
        完整条件：
        三圣物
        三谜题
        三家人
        完整真相
    */

    const hasRelics =
        game.collected.locket &&
        game.collected.rattle &&
        game.collected.kitchen_knife;

    const puzzlesDone =
        game.puzzles.diary &&
        game.puzzles.toybox &&
        game.puzzles.desk;

    const metFamily =
        game.family.father &&
        game.family.mother &&
        game.family.child;

    const knowsTruth =
        game.clues.diary_read &&
        game.clues.symbol_chart &&
        game.clues.desk_document;

    game.ritualPerformed = true;

    addStory(
        "你跪在壁炉前。\n\n老宅里所有声音突然同时停止。",
        "danger"
    );

    if (
        !hasRelics ||
        !puzzlesDone ||
        !knowsTruth
    ) {
        addStory(
            "你尝试启动仪式，但火焰没有按照文献描述燃烧。\n\n有什么东西察觉到了你的错误。",
            "danger"
        );

        setTimeout(() => {
            triggerEnding("failed");
        }, 350);

        return;
    }

    if (!metFamily) {
        addStory(
            "幽蓝色火焰短暂亮起，却立刻熄灭。\n\n文献最后一页浮现出你此前没有注意到的一句话：\n『必须由全部残留的血脉见证契约终结。』",
            "danger"
        );

        game.ritualPerformed = false;

        return;
    }

    addStory(
        "你把吊坠、摇铃和祭刃放入壁炉。\n\n蓝白色火焰骤然升起，整个宅邸开始震动。",
        "event"
    );

    addStory(
        "楼上传来孩子的哭声。\n\n墙壁内部响起数十个人同时低语的声音。",
        "danger"
    );

    /*
        修复原版不可达的牺牲结局：

        高理智 -> 真结局
        中等理智 -> 牺牲结局
        低理智 -> 腐化结局
    */

    if (game.sanity >= 65) {
        setTimeout(() => {
            triggerEnding("true");
        }, 500);

        return;
    }

    if (game.sanity >= 35) {
        setTimeout(() => {
            triggerEnding("sacrifice");
        }, 500);

        return;
    }

    setTimeout(() => {
        triggerEnding("corrupted");
    }, 500);
}


/* =========================================================
   结局
========================================================= */

function triggerEnding(type) {
    if (game.gameOver) return;

    game.gameOver = true;

    let title = "";
    let text = "";


    if (type === "true") {
        title = "真 · 破咒";

        text =
            "你没有回应火焰中传来的任何声音。\n\n" +
            "吊坠熔化，摇铃发出最后一次清响，菜刀上的暗红痕迹化成灰烬。\n\n" +
            "父亲、母亲和孩子站在你身后。他们的身体逐渐变得透明。\n\n" +
            "孩子第一次露出了真正属于孩子的笑容。\n\n" +
            "黎明时，你推开了那扇原本永远打不开的前门。\n\n" +
            "老宅在你身后安静地坍塌。\n\n" +
            "诅咒结束了。";
    }


    if (type === "sacrifice") {
        title = "牺牲 · 救赎";

        text =
            "仪式成功了，但你的意识已经无法完全抵抗最后的侵蚀。\n\n" +
            "邪灵试图抓住你时，你把吊坠紧紧握在手中。\n\n" +
            "你主动留下了一部分属于自己的记忆，让它代替家人的灵魂成为最后的代价。\n\n" +
            "老宅获得了安静。\n\n" +
            "你最终活着走了出去，却再也想不起自己童年的很多事情。\n\n" +
            "多年以后，你偶尔仍会梦见一个拿着摇铃的孩子。";
    }


    if (type === "corrupted") {
        title = "腐化 · 新的容器";

        text =
            "火焰确实摧毁了旧契约。\n\n" +
            "但在最后一刻，你听见了一个声音在耳边说：\n\n" +
            "『谢谢你。』\n\n" +
            "你睁开眼时，仪式已经结束。\n\n" +
            "家人的亡魂消失了。\n\n" +
            "你也离开了老宅。\n\n" +
            "只是从那以后，每当你照镜子，倒影都会比你晚半秒露出笑容。";
    }


    if (type === "failed") {
        title = "仪式失败";

        text =
            "错误的仪式唤醒了本应继续沉睡的东西。\n\n" +
            "壁炉里的火焰变成漆黑颜色，墙壁像活物一样开始收缩。\n\n" +
            "你终于明白为什么那一家人一百年来始终无法离开。\n\n" +
            "因为这栋房子从来没有打算放走任何知道真相的人。";
    }


    if (type === "madness") {
        title = "理智崩溃";

        text =
            "你开始听不出那些脚步声究竟来自楼上、楼下，还是来自自己的脑海。\n\n" +
            "照片里的人越来越熟悉。\n\n" +
            "最后，你坐在全家福下面，等着下一位进入老宅的人。\n\n" +
            "后来，那张照片里多出了一个人。";
    }


    document.getElementById("endingTitle").textContent = title;
    document.getElementById("endingText").textContent = text;

    document
        .getElementById("endingOverlay")
        .classList
        .add("show");

    updateUI();
}


/* =========================================================
   提示
========================================================= */

function showHelp() {
    let hint = getObjective();

    if (
        game.sanity <= 35 &&
        !game.gameOver
    ) {
        hint +=
            "\n\n⚠ 你的理智很低。主卧的床可以在夜间真正睡眠，椅子、沙发和床也可以短暂休息。";
    }

    addStory(
        "💡 提示：\n" + hint,
        "system"
    );
}


/* =========================================================
   重开
========================================================= */

function restartGame() {
    game = defaultGame();

    document
        .getElementById("endingOverlay")
        .classList
        .remove("show");

    document
        .getElementById("story")
        .innerHTML = "";

    startGame();
}


/* =========================================================
   开始
========================================================= */

function startGame() {
    addStory(
        "════════════════════════════\n" +
        "        恐 怖 一 家\n" +
        "════════════════════════════",
        "event"
    );

    addStory(
        "你不知道自己为什么会来到这里。\n\n" +
        "最后的记忆，是暴雨中的山路，以及路边那栋本应早已废弃的老宅。\n\n" +
        "当你醒来时，前门已经无法打开。"
    );

    addStory(
        "找到三件圣物，解开宅邸留下的谜题，并查明这一家人在 1927 年究竟做了什么。",
        "system"
    );

    addStory(
        descriptions.entrance_hall
    );

    updateUI();
}


startGame();

</script>

</html>
